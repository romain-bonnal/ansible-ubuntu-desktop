---

- name: Download espanso
  get_url: url="https://github.com/espanso/espanso/releases/latest/download/espanso-debian-x11-amd64.deb"
          
- name: Install espanso
  apt: deb="/tmp/espanso-debian.deb"

- name: Register as service
  command: espanso service register
  register: myoutput
  become: true
  become_user: "{{ ansible_env.USER }}"