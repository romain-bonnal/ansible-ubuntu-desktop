---

- name: Download espanso
  get_url:
    url: "https://github.com/espanso/espanso/releases/latest/download/espanso-debian-x11-amd64.deb"
    dest: "/tmp/espanso-debian-x11-amd64.deb"
    mode: "0644"

- name: Install espanso
  become: true
  apt:
    deb: "/tmp/espanso-debian-x11-amd64.deb"
    state: present

- name: Register as service
  command: espanso service register
  register: myoutput
  become: true
  become_user: "{{ ansible_env.USER }}"